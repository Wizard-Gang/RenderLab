name: Delivery gates

# The full suite: release PRs into main, and an on-demand run for any branch. It satisfies no release-branch gate.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@12.1.0
      - name: Install locked dependencies
        run: npm ci
      - name: Test repository contracts
        run: npm run check
      - name: Install Chromium and WebKit outside npm lifecycle scripts
        run: npx playwright install --with-deps chromium webkit
      - name: Run Chromium and WebKit browser tests
        run: npm run test:browser
      - name: Check committed PR patch
        if: github.event_name == 'pull_request'
        env:
          PATCH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:patch

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@12.1.0
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm run audit:dependencies
